# Catches broken commits before Vercel ever sees them.
# Runs Prisma generate, TypeScript type-check, and a full Next build
# on every push to main / dev and on every PR targeting them.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CI doesn't connect to Supabase — we stub the env vars with values
    # that satisfy the validators in app/_lib/env.ts. They never get
    # used because we only run typecheck + build, not the app itself.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/postgres"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/postgres"
      ADMIN_PASSWORD: "ci-placeholder"
      SESSION_SECRET: "ci-placeholder-secret-at-least-32-chars-long"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
